<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevum — Support</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #1f2833;
            --text-main: #c5c6c7;
            --text-muted: #8892b0;
            --accent: #66fcf1;
            --secondary: #45a29e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--surface);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border-top: 4px solid var(--accent);
            text-align: center;
        }
        h1 {
            color: var(--accent);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 20px;
            font-size: 2.5rem;
            margin-top: 0;
        }
        p {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 30px;
        }
        .contact-box {
            background-color: rgba(102, 252, 241, 0.1);
            border: 1px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        a { color: var(--accent); text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .footer-nav {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #333;
            padding-top: 20px;
            font-size: 0.95rem;
        }
        .footer-nav a { font-weight: normal; }
    </style>
</head>
<body>
    <div id="header"></div>

<script>
fetch('/header.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('header').innerHTML = data;
  });
</script>
    <div class="container">
        <h1>Support</h1>
        <p>Need help with Aevum? For technical support, product questions, or privacy-related requests, please contact the team directly.</p>
        <div class="contact-box">
            Support: <a href="mailto:support@aevum.world">support@aevum.world</a><br>
            Privacy: <a href="mailto:compliance@aevum.world">compliance@aevum.world</a>
        </div>
        <p>We aim to respond within 1-2 business days.</p>
        <div class="footer-nav">
            <a href="index.html">← Back to Home</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Use</a>
        </div>
    </div>
</body>
</html>
